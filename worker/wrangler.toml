name = "google-cloud-connector"
main = "src/index.js"
compatibility_date = "2026-10-30"
workers_dev = true

# Neon HTTP driver; no D1 or KV database bindings.
# Secrets must be provisioned through Workers > Settings > Variables and Secrets.
# Never add DATABASE_URL, Google credentials, JWTs or encryption keys here.
[vars]
ENVIRONMENT = "production"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[env.development]
name = "google-cloud-connector-development"
[env.development.vars]
ENVIRONMENT = "development"
APP_ORIGIN = "https://google-cloud-connector-development.sparkmind-support.workers.dev"
GOOGLE_REDIRECT_URI = "https://google-cloud-connector-development.sparkmind-support.workers.dev/oauth/google/callback"
MCP_AUTH_AUDIENCE = "https://google-cloud-connector-development.sparkmind-support.workers.dev/mcp"
ENABLE_BUDGET_READ = "false"
